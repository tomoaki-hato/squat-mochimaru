<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>スクワットもちまる</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen pet room — cutaway room scene on top, today's 50-rep goal under it, week strip, controls docked at the bottom. Single light look by choice. */
:root{
  --bg:#E6F2EE; --floor:#CFE6DE; --ink:#24363A; --muted:#5D7275; --card:#FFFFFF;
  --coral:#FF6F86; --sun:#FFC24A; --mochi:#FFEFE4; --mochi-edge:#F2CDB8; --sick:#7D8FB3;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.name{display:flex;align-items:baseline;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.tag{font-weight:900;font-size:12px;background:var(--card);border-radius:999px;padding:3px 10px;color:var(--coral);white-space:nowrap}
.health{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:var(--muted)}
.hearts{font-size:17px;letter-spacing:1px;color:var(--coral)}
.hearts .off{color:#C9D6D2}

.scene{position:relative;background:var(--card);border-radius:22px;padding:8px;box-shadow:0 3px 0 var(--floor)}
#room{display:block;width:100%;height:auto;cursor:pointer}
.stage{position:relative}
#pet3d{position:absolute;left:22%;width:56%;top:22%;height:74%;pointer-events:none}
#pet3d canvas{display:block;width:100%!important;height:100%!important}
.gallery img{width:100%;height:auto;background:var(--card);border-radius:10px;display:block}
#room .pet{transform-box:fill-box;transform-origin:50% 100%}
#room .pet.hop{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
#room .pet.idle{animation:breathe 3.2s ease-in-out infinite}
#room .pet.shiver{animation:shiver 1.6s ease-in-out infinite}
@keyframes hop{0%{transform:scale(1.12,.86)}45%{transform:translateY(-14px) scale(.94,1.08)}100%{transform:none}}
@keyframes breathe{50%{transform:scale(1.02,.98)}}
@keyframes shiver{0%,100%{transform:translateX(0)}10%{transform:translateX(-1.5px)}20%{transform:translateX(1.5px)}30%{transform:none}}
#room .new{animation:pop .9s ease}
@keyframes pop{0%{opacity:0;transform:translateY(-10px)}60%{opacity:1;transform:translateY(2px)}100%{transform:none}}
.bubble{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:88%;background:var(--ink);color:#fff;border-radius:14px;padding:5px 12px;font-weight:700;font-size:12px;line-height:1.5;text-align:center;width:max-content;text-wrap:balance;transition:opacity .3s}
.heart{position:absolute;font-size:20px;color:var(--coral);pointer-events:none;animation:float 1.1s ease-out forwards}
@keyframes float{to{transform:translateY(-80px) scale(1.4);opacity:0}}
.celebrate{position:absolute;inset:8px;border-radius:16px;background:rgba(255,255,255,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;cursor:pointer}
.celebrate b{font-family:var(--display);font-weight:400;font-size:30px;color:var(--coral)}
.celebrate p{margin:0;font-weight:700;line-height:1.6}
.celebrate small{color:var(--muted);font-weight:700}

.goal{display:flex;flex-direction:column;gap:6px}
.goal-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.goal-row .label{font-weight:900;font-size:13px;color:var(--muted);padding-bottom:8px}
.nums{line-height:1;font-variant-numeric:tabular-nums}
#count{font-family:var(--display);font-size:60px}
.nums span{font-weight:900;font-size:18px;color:var(--muted)}
.bar{height:14px;border-radius:999px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);border-radius:inherit;transition:width .4s}
.bar.done i{background:var(--coral)}
#next{font-size:13px;color:var(--muted);font-weight:700}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:12px;font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.dot.ok{background:var(--coral);color:#fff}
.dot.miss{background:#DCE3EC;color:var(--sick)}
.dot.today{outline:2px solid var(--ink);outline-offset:1px}

.dock{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-weight:900;font-size:17px;border:0;border-radius:18px;padding:16px;background:var(--coral);color:#fff;box-shadow:0 4px 0 #D94C64;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D94C64}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--floor)}
.btn:focus-visible,.small:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.status{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;font-size:13px;font-weight:700}
.meter{width:10px;height:36px;border-radius:5px;background:var(--bg);position:relative;overflow:hidden;flex:none}
.meter i{position:absolute;left:0;right:0;top:18px;height:0;background:var(--coral)}
.status p{margin:0;min-width:0}
.notice{background:#FFF4D6;border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.6;margin:0}
details{font-size:13px}
summary{cursor:pointer;color:var(--muted);font-weight:700;padding:4px 0}
.settings{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
input[type=range]{flex:1;accent-color:var(--coral)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font:inherit;font-weight:700;font-size:13px;border:0;border-radius:12px;padding:8px 12px;background:var(--card);color:var(--ink);cursor:pointer}
.hint{margin:0;color:var(--muted);line-height:1.6}
.out{min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.dbg-group{display:flex;flex-direction:column;gap:6px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg .small{padding:8px 4px}
.seg .small.on,.items .on{background:var(--ink);color:#fff}
.gallery{display:grid;grid-template-columns:auto repeat(4,1fr);gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.gallery svg{width:100%;height:auto;background:var(--card);border-radius:10px}
.gallery .gh{text-align:center}
.gallery .gr{writing-mode:horizontal-tb;white-space:nowrap;padding-right:4px}
.items{display:flex;flex-wrap:wrap;gap:4px}
.items button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:10px;padding:6px 8px;background:var(--card);color:var(--ink);cursor:pointer}
.dbg-badge{position:absolute;bottom:14px;left:14px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:900;border-radius:8px;padding:3px 8px}
@media (prefers-reduced-motion:reduce){#room .pet,#room .new,.heart{animation:none!important}}
</style>

<div class="app">
  <header>
    <div class="name"><h1>もちまる</h1><span class="tag" id="stageTag">たまご</span></div>
    <div class="health"><span id="healthText">げんき</span><span class="hearts" id="hearts"></span></div>
  </header>

  <div class="scene" id="scene">
    <div class="stage"><svg id="room" viewBox="0 0 360 270" role="img" aria-label="もちまるのお部屋"></svg><div id="pet3d" aria-hidden="true"></div></div>
    <div class="bubble" id="bubble"></div>
  </div>

  <div class="goal">
    <div class="goal-row">
      <span class="label">今日のスクワット</span>
      <div class="nums"><b id="count">0</b><span> / 50回</span></div>
    </div>
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div id="next"></div>
  </div>

  <div class="week" id="week" aria-label="この7日間"></div>

  <div class="dock">
    <button class="btn" id="startBtn">スクワットをはじめる</button>
    <div class="status" id="status" hidden>
      <div class="meter"><i id="meterFill"></i></div>
      <p>スマホを胸の前で持って、しゃがんで立とう</p>
    </div>
    <p class="notice" id="notice" hidden></p>
    <button class="btn ghost" id="tapBtn" hidden>1回できた！（タップで数える）</button>
    <button class="btn ghost" id="stopBtn" hidden>運動を終える</button>
    <details>
      <summary>設定</summary>
      <div class="settings">
        <label for="sens">感度 <input type="range" id="sens" min="1" max="5" value="3"></label>
        <label for="voiceOn">10回ごとに声で応援 <input type="checkbox" id="voiceOn" checked style="width:22px;height:22px;accent-color:var(--coral)"></label>
        <p class="hint">1日50回で目標達成。1日の区切りは朝4時です。達成するたびにもちまるが育ち、お部屋に家具が届きます。達成できなかった日が続くと、だんだん弱って病気になります。</p>
        <div class="row"><button class="small" id="skipBtn">テスト：次の日にする</button></div>
        <div class="row" id="resetArea"></div>
      </div>
    </details>
    <details id="debug">
      <summary>デバッグ</summary>
      <div class="settings">
        <p class="hint">ここで変えた状態はプレビューです。「元のデータに戻す」で元に戻り、「この状態を保存」を押したときだけ保存されます。</p>
        <label for="dbgDays">達成日数 <input type="range" id="dbgDays" min="0" max="35" value="0"><output id="dbgDaysOut" class="out">0日</output></label>
        <p class="hint" id="dbgInfo"></p>
        <div class="dbg-group">
          <span>健康</span>
          <div class="seg" id="dbgHealth">
            <button class="small" data-h="3">げんき</button><button class="small" data-h="2">つかれ</button><button class="small" data-h="1">よわってる</button><button class="small" data-h="0">びょうき</button>
          </div>
        </div>
        <label for="dbgCount">今日の回数 <input type="range" id="dbgCount" min="0" max="60" value="0"><output id="dbgCountOut" class="out">0回</output></label>
        <div class="row">
          <button class="small" id="dbgPlus">+1回（スクワット扱い）</button>
          <button class="small" id="dbgCele">達成演出を見る</button>
        </div>
        <div class="row">
          <button class="small" id="dbgRestore">元のデータに戻す</button>
          <button class="small" id="dbgSave">この状態を保存</button>
        </div>
        <div class="dbg-group">
          <span>ペット全種類（成長 × 健康）</span>
          <div class="gallery" id="gallery"></div>
        </div>
        <div class="dbg-group">
          <span>家具が届く日</span>
          <div class="items" id="itemList"></div>
        </div>
      </div>
    </details>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const GOAL=50;
const STAGES=[{at:0,name:"たまご"},{at:1,name:"あかちゃん"},{at:3,name:"こども"},{at:7,name:"わんぱく"},{at:14,name:"りっぱ"},{at:30,name:"でんせつ"}];
const ITEMS={1:"ふかふかラグ",2:"ペットベッド",3:"観葉植物",4:"窓",5:"かべの本だな",6:"ペンダントライト",7:"お部屋が広くなった",8:"かわいい壁紙",9:"かけ時計",10:"サイドテーブル",11:"つるす植物",12:"絵",13:"おもちゃのボール",14:"もっと広いお部屋とフローリング",15:"大きな本棚",16:"ひじかけいす",17:"シャンデリア",20:"だんろ",25:"金のトロフィー",30:"でんせつのお屋敷"};
const HEALTH=[
  {name:"びょうき",line:"ねつがある…50回で少し元気になれるかも"},
  {name:"よわってる",line:"からだがだるい…いっしょにスクワットして…"},
  {name:"ちょっとつかれ",line:"ちょっとつかれたかも。今日はがんばろ"},
  {name:"げんき",line:"今日もいっしょにがんばろ！"}
];
const CHEERS=["いいね！","もう1回！","その調子！","ぷにぷに〜","ナイス！","足、つよい！"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dateOf=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};

let S={achieved:0,health:3,days:{},last:null,offset:0};
const DAY_START_HOUR=4; // the day switches at 4:00 am
function todayDate(){const d=new Date(Date.now()-DAY_START_HOUR*3600e3);d.setHours(0,0,0,0);d.setDate(d.getDate()+S.offset);return d;}
const todayKey=()=>keyOf(todayDate());
function load(){try{const v=JSON.parse(localStorage.getItem("mochimaru-v3"));if(v&&typeof v==="object")S=Object.assign(S,v);}catch(e){}}
let backup=null; // set while the debug panel is previewing
function save(){if(backup)return;try{localStorage.setItem("mochimaru-v3",JSON.stringify(S));}catch(e){}}

/* days that ended below the goal (including days the game was not opened) cost one heart each */
function rollover(){
  const t=todayKey();
  if(!S.last){S.last=t;save();return 0;}
  if(S.last===t)return 0;
  const d=dateOf(S.last),end=todayDate();let missed=0,n=0;
  while(d<end&&n<120){if((S.days[keyOf(d)]||0)<GOAL){S.health=Math.max(0,S.health-1);missed++;}d.setDate(d.getDate()+1);n++;}
  S.last=t;
  const keep=new Date(end);keep.setDate(keep.getDate()-40);
  Object.keys(S.days).forEach(k=>{if(dateOf(k)<keep)delete S.days[k];});
  save();return missed;
}
const stageOf=n=>{let s=0;STAGES.forEach((st,i)=>{if(n>=st.at)s=i});return s;};

/* ---------- pet ---------- */
function petSVG(s,h){
  const body=h>=2?"var(--mochi)":h===1?"#F7EAE4":"#ECE7F0";
  const edge=h>=1?"var(--mochi-edge)":"#C9C2D8";
  if(s===0){
    let x=`<ellipse cx="100" cy="186" rx="46" ry="7" fill="#000" opacity=".08"/>
    <path d="M100 52c30 0 50 44 50 80s-22 48-50 48-50-12-50-48 20-80 50-80z" fill="${h>=1?"#FFF8F0":"#EEEAF3"}" stroke="${edge}" stroke-width="3"/>
    <circle cx="82" cy="108" r="8" fill="#FFD3C2"/><circle cx="116" cy="88" r="6" fill="#FFE29A"/><circle cx="120" cy="140" r="10" fill="#FFD3C2"/><circle cx="84" cy="152" r="5" fill="#FFE29A"/>`;
    if(h<=1)x+=`<path d="M70 100 l12 8 -6 10 12 6" stroke="${edge}" stroke-width="3" fill="none" stroke-linejoin="round"/>`;
    if(h===0)x+=`<rect x="104" y="64" width="34" height="12" rx="4" fill="#fff" stroke="#E4D9D2" stroke-width="2" transform="rotate(25 121 70)"/>`;
    return x;
  }
  const r=[0,40,52,62,70,78][s], cy=180-r*0.85, rx=r*1.12, top=cy-r*0.88;
  let back="",front="";
  if(s>=2){[-1,1].forEach(k=>{back+=`<ellipse cx="${100+k*r*0.62}" cy="${cy-r*0.7}" rx="${r*0.22}" ry="${r*0.34}" fill="${body}" stroke="${edge}" stroke-width="3" transform="rotate(${k*(h===0?40:20)} ${100+k*r*0.62} ${cy-r*0.7})"/>`;});}
  if(s>=3)back+=`<circle cx="${100+rx*0.95}" cy="${cy+r*0.45}" r="${r*0.2}" fill="${body}" stroke="${edge}" stroke-width="3"/>`;
  if(s===1)front+=`<path d="M${100-r*0.45} ${top+6} l${r*0.15} -14 l${r*0.15} 10 l${r*0.15} -12 l${r*0.15} 12 l${r*0.15} -14 l${r*0.15} 16 z" fill="#FFF8F0" stroke="var(--mochi-edge)" stroke-width="3" stroke-linejoin="round"/>`;
  if(s===3)front+=`<path d="M100 ${top+4} v-16" stroke="#5DAE7B" stroke-width="4" stroke-linecap="round"/><path d="M100 ${top-10} c-14 -10 -24 -2 -24 -2 c8 10 24 2 24 2z M100 ${top-10} c14 -10 24 -2 24 -2 c-8 10 -24 2 -24 2z" fill="#7CC795"/>`;
  if(s===4){front+=`<path d="M100 ${top+4} v-14" stroke="#5DAE7B" stroke-width="4" stroke-linecap="round"/>`;for(let i=0;i<5;i++){const a=i*72*Math.PI/180;front+=`<circle cx="${100+Math.cos(a)*9}" cy="${top-18+Math.sin(a)*9}" r="7" fill="var(--coral)"/>`;}front+=`<circle cx="100" cy="${top-18}" r="6" fill="var(--sun)"/>`;}
  if(s===5)front+=`<path d="M76 ${top+6} l-4 -26 l14 12 l14 -20 l14 20 l14 -12 l-4 26 z" fill="var(--sun)" stroke="#E0A11F" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="${top-6}" r="4" fill="var(--coral)"/>`;
  const eyeY=cy-r*0.1, dx=r*0.36, er=Math.max(4,r*0.09);
  let eyes;
  if(h===3) eyes=[-1,1].map(k=>`<circle cx="${100+k*dx}" cy="${eyeY}" r="${er}" fill="var(--ink)"/><circle cx="${100+k*dx+er*0.35}" cy="${eyeY-er*0.35}" r="${er*0.35}" fill="#fff"/>`).join("");
  else if(h===2) eyes=[-1,1].map(k=>`<circle cx="${100+k*dx}" cy="${eyeY+er*0.3}" r="${er*0.8}" fill="var(--ink)"/><path d="M${100+k*dx-er*1.2} ${eyeY-er*0.2} h${er*2.4}" stroke="${edge}" stroke-width="3" stroke-linecap="round"/>`).join("");
  else if(h===1) eyes=[-1,1].map(k=>`<path d="M${100+k*dx-er} ${eyeY} q${er} ${er} ${er*2} 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>`).join("");
  else eyes=[-1,1].map(k=>{const x=100+k*dx;return `<path d="M${x-k*er} ${eyeY-er*0.7} L${x+k*er} ${eyeY} L${x-k*er} ${eyeY+er*0.7}" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;}).join("");
  const mouth=h>=2?`<path d="M${100-r*0.1} ${eyeY+r*0.16} q${r*0.1} ${r*0.12} ${r*0.2} 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>`
                  :`<path d="M${100-r*0.1} ${eyeY+r*0.24} q${r*0.1} ${-r*0.1} ${r*0.2} 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const blush=h>=1?[-1,1].map(k=>`<ellipse cx="${100+k*(dx+r*0.12)}" cy="${eyeY+r*0.22}" rx="${r*0.13}" ry="${r*0.07}" fill="${h>=2?"#FFB3BF":"#F2C9CF"}"/>`).join(""):"";
  let extra="";
  if(h===2) extra+=`<path d="M${100+rx*0.85} ${cy-r*0.5} q6 10 0 14 q-6 -4 0 -14z" fill="#9FD3F0"/>`;
  if(h<=1) extra+=[0,1,2].map(i=>`<path d="M${100-r*0.25+i*r*0.25} ${cy-r*0.62} v${r*0.14}" stroke="var(--sick)" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>`).join("");
  if(h===0) extra+=`<rect x="${100-r*0.55}" y="${top-4}" width="${r*1.1}" height="${r*0.28}" rx="6" fill="#BFE1F7" stroke="#8EC3E6" stroke-width="2"/>
    <path d="M${100+r*0.08} ${eyeY+r*0.2} l${r*0.5} ${r*0.18}" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M${100+r*0.08} ${eyeY+r*0.2} l${r*0.5} ${r*0.18}" stroke="#E2E8EE" stroke-width="3" stroke-linecap="round"/><circle cx="${100+r*0.58}" cy="${eyeY+r*0.38}" r="3.5" fill="var(--coral)"/>
    <text x="${100+rx}" y="${top-6}" font-size="18" font-weight="900" fill="var(--sick)" font-family="var(--body)">z</text><text x="${100+rx+12}" y="${top-20}" font-size="13" font-weight="900" fill="var(--sick)" font-family="var(--body)">z</text>`;
  const feet=s>=2?[-1,1].map(k=>`<ellipse cx="${100+k*r*0.45}" cy="${cy+r*0.86}" rx="${r*0.24}" ry="${r*0.12}" fill="${edge}"/>`).join(""):"";
  return `<ellipse cx="100" cy="186" rx="${rx*0.9}" ry="7" fill="#000" opacity=".08"/>${back}${feet}
  <path d="M${100-rx} ${cy+r*0.3} C${100-rx} ${cy-r*1.05} ${100+rx} ${cy-r*1.05} ${100+rx} ${cy+r*0.3} C${100+rx} ${cy+r*0.95} ${100-rx} ${cy+r*0.95} ${100-rx} ${cy+r*0.3}Z" fill="${body}" stroke="${edge}" stroke-width="3"/>
  ${eyes}${blush}${mouth}${front}${extra}`;
}

/* ---------- room: grows with achieved days ---------- */
function roomSVG(a,h,fresh){

  // ceiling light
  if(a>=17) s+=g(17,`<path d="M180 12V30" stroke="#C9A23D" stroke-width="2"/><path d="M156 38 q24 14 48 0" stroke="#E5B542" stroke-width="4" fill="none"/><path d="M168 30h24" stroke="#E5B542" stroke-width="4"/>

  s+=g(10,`<rect x="72" y="208" width="46" height="6" rx="2" fill="#B98552"/><path d="M78 214V242M112 214V242" stroke="#8E623A" stroke-width="4"/><rect x="88" y="196" width="12" height="12" rx="2" fill="#fff" stroke="var(--ink)" stroke-width="1.5"/><path d="M100 199 q6 3 0 6" stroke="var(--ink)" stroke-width="1.5" fill="none"/>`);
  s+=g(3,`<path d="M272 206 q-18 -16 -10 -34 q8 12 10 22 q0 -24 12 -32 q4 20 -6 36 q14 -14 22 -12 q-6 16 -22 22z" fill="#6DBB86"/><path d="M262 208h24l-4 30h-16z" fill="#E09A6A"/>`);
  s+=g(13,`<circle cx="246" cy="240" r="8" fill="var(--coral)"/><path d="M238 240h16" stroke="#fff" stroke-width="3"/>`);
  s+=g(2,`<ellipse cx="180" cy="238" rx="54" ry="11" fill="#8EC6D8"/><ellipse cx="180" cy="234" rx="44" ry="7" fill="#B5DCE8"/>`);
  // pet
  const st=stageOf(a);
  if(!PET3D) s+=`<g transform="translate(125 134) scale(.55)"><g class="pet ${h<=1?"shiver":"idle"}" id="petG">${petSVG(st,h)}</g></g>`;
  // sick tint
  if(h<3) s+=`<rect x="${L}" y="12" width="${W}" height="246" fill="var(--sick)" opacity="${[0.22,0.14,0.06][h]}" pointer-events="none"/>`;
  s+=`<rect x="${L}" y="12" width="${W}" height="246" fill="none" stroke="var(--ink)" stroke-width="3" rx="4"/>`;

}

/* ---------- UI ---------- */
let bubbleTimer;
function say(t,ms){const b=$("bubble");b.textContent=t;b.style.opacity=1;clearTimeout(bubbleTimer);if(ms)bubbleTimer=setTimeout(()=>{b.style.opacity=0},ms);}
function nextItem(a){const ks=Object.keys(ITEMS).map(Number).sort((x,y)=>x-y);return ks.find(k=>k>a);}
function render(fresh){
  const tk=todayKey(), c=S.days[tk]||0, a=S.achieved, h=S.health;
  $("room").innerHTML=roomSVG(a,h,fresh);
  if(PET3D)PET3D.set(stageOf(a),h);
  $("stageTag").textContent=STAGES[stageOf(a)].name;
  $("healthText").textContent=HEALTH[h].name;
  $("hearts").innerHTML=[0,1,2].map(i=>`<span class="${i<h?"":"off"}">♥</span>`).join("");
  $("count").textContent=c;
  $("barFill").style.width=Math.min(100,c/GOAL*100)+"%";
  $("bar").classList.toggle("done",c>=GOAL);
  const nk=nextItem(a);
  if(c>=GOAL) $("next").textContent=`今日は達成！ 達成 ${a}日目。${nk?`あと${nk-a}日達成で「${ITEMS[nk]}」`:"お屋敷は完成しました"}`;
  else $("next").textContent=`あと${GOAL-c}回で今日の目標達成。${nk===a+1?`「${ITEMS[nk]}」が届くよ`:nk?`次の家具まであと${nk-a}日`:""}`;
  // week strip
  const wd="日月火水木金土";let w="";
  for(let i=6;i>=0;i--){const d=todayDate();d.setDate(d.getDate()-i);const k=keyOf(d),n=S.days[k]||0;
    const cls=n>=GOAL?"ok":(i>0&&S.last&&dateOf(k)>=dateOf(S.firstDay||k)?"miss":"");
    w+=`<div class="day"><span class="dot ${cls} ${i===0?"today":""}">${n>=GOAL?"✓":n||""}</span>${i===0?"今日":wd[d.getDay()]}</div>`;}
  $("week").innerHTML=w;
  syncDebug();
}

/* ---------- debug ---------- */
function syncDebug(){
  const a=S.achieved,c=S.days[todayKey()]||0;
  $("dbgDays").value=Math.min(35,a);$("dbgDaysOut").textContent=a+"日";
  $("dbgCount").value=Math.min(60,c);$("dbgCountOut").textContent=c+"回";

  $("dbgInfo").textContent=`成長：${STAGES[stageOf(a)].name}／お部屋：${a>=14?"いちばん広い":a>=7?"広い":"せまい"}／家具 ${got.length}/${Object.keys(ITEMS).length}`;
  document.querySelectorAll("#dbgHealth button").forEach(b=>b.classList.toggle("on",+b.dataset.h===S.health));

function dbgStart(){if(!backup)backup=JSON.parse(JSON.stringify(S));}
$("dbgDays").addEventListener("input",e=>{dbgStart();const a=+e.target.value;S.achieved=a;render(ITEMS[a]?a:undefined);});
$("dbgCount").addEventListener("input",e=>{dbgStart();S.days[todayKey()]=+e.target.value;render();});
document.querySelectorAll("#dbgHealth button").forEach(b=>b.addEventListener("click",()=>{dbgStart();S.health=+b.dataset.h;render();say(HEALTH[S.health].line,2500);}));
$("dbgPlus").addEventListener("click",()=>{dbgStart();ensureAudio();rep();});
$("dbgCele").addEventListener("click",()=>{dbgStart();const a=Math.max(1,S.achieved);celebrate(a,STAGES.some(s=>s.at===a),S.health<3);});
$("dbgRestore").addEventListener("click",()=>{if(backup){S=backup;backup=null;}render();say("元のデータに戻したよ",2000);});
$("dbgSave").addEventListener("click",()=>{backup=null;save();render();say("この状態を保存したよ",2000);});
(function buildDebug(){
  $("itemList").innerHTML=Object.keys(ITEMS).map(Number).sort((x,y)=>x-y).map(k=>`<button data-a="${k}">${k}日：${ITEMS[k]}</button>`).join("");
  document.querySelectorAll("#itemList button").forEach(b=>b.addEventListener("click",()=>{dbgStart();S.achieved=+b.dataset.a;render(S.achieved);}));
})();
function petHop(){if(PET3D){PET3D.hop();return;}const p=document.getElementById("petG");if(!p)return;const base=S.health<=1?"shiver":"idle";p.classList.remove("hop","idle","shiver");void p.getBBox();requestAnimationFrame(()=>{p.classList.add("hop");p.addEventListener("animationend",()=>{p.classList.remove("hop");p.classList.add(base);},{once:true});});}
function heart(){const h=document.createElement("span");h.className="heart";h.textContent="♥";h.style.left=(42+Math.random()*16)+"%";h.style.top="55%";$("scene").appendChild(h);setTimeout(()=>h.remove(),1200);}
function celebrate(a,stageUp,healed){
  const el=document.createElement("div");el.className="celebrate";
  const item=ITEMS[a];
  el.innerHTML=`<b>目標達成！</b><p>${stageUp?`もちまるが「${STAGES[stageOf(a)].name}」に成長した！<br>`:""}${item?`${item}${a===7||a===14?"！":"が届いたよ！"}`:"もちまるが大よろこび！"}${healed?`<br>少し元気になった`:""}</p><small>タップでとじる</small>`;
  PET3D?.spin();
  el.onclick=()=>el.remove();$("scene").appendChild(el);setTimeout(()=>el.remove(),5000);
}

let actx;
function beep(f,len){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+(len||.18));o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+(len||.18)+.02);}catch(e){}}

let lastRepAt=0;
function rep(){
  lastRepAt=Date.now();sessionReps++;
  if(rollover())render();
  const tk=todayKey(), before=S.days[tk]||0;
  S.days[tk]=before+1;
  if(before+1===GOAL){
    const st=stageOf(S.achieved), wasH=S.health;
    S.achieved++; S.health=Math.min(3,S.health+1); save();
    render(S.achieved);
    celebrate(S.achieved,stageOf(S.achieved)!==st,S.health>wasH);
    [660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*140));
    setTimeout(()=>speak(pickVoice(GOAL).speech),450);
  }else{
    save();render();
    const n=before+1;
    if(n%10===0){const v=pickVoice(n);say(v.text,2200);speak(v.speech);}
    else say(n>GOAL?"ボーナス！":CHEERS[Math.floor(Math.random()*CHEERS.length)],1200);
    beep(620);
  }
  petHop();heart();
  try{navigator.vibrate&&navigator.vibrate(before+1===GOAL?[60,60,120]:40);}catch(e){}
}

/* ---------- squat detection: a push phase (+) followed by a settle phase (−) is one rep ---------- */
const TH=[0,2.2,1.8,1.4,1.1,0.8];
let base=null,f=0,phase=0,posStart=0,lastRep=0,gotMotion=false;
let running=false,sessionReps=0,wake=null;
function onMotion(e){
  const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;gotMotion=true;
  const m=Math.hypot(a.x,a.y,a.z);if(base===null)base=m;
  base+=(m-base)*0.01;f+=((m-base)-f)*0.25;
  const T=TH[+$("sens").value],now=performance.now();
  if(f>T){if(phase!==1){phase=1;posStart=now;}}
  else if(f<-T*0.8){if(phase===1&&now-posStart>120&&now-lastRep>900){lastRep=now;rep();}phase=-1;}
  const mf=$("meterFill"),hh=Math.min(18,Math.abs(f)/T*12);mf.style.height=hh+"px";mf.style.top=(f>0?18-hh:18)+"px";
}
/* ---------- voice every 10 reps (Web Speech API) ---------- */
/* [bubble text, robot speech]: katakana split by 。 gives flat, choppy beats; the key word is said twice */
const VOICE={
  10:[["いい調子！","イイチョウシ。イイチョウシ。"],["10回！ナイス！","ジュッカイ。ナイス。ナイス。"],["その調子！","ソノチョウシ。ソノチョウシ。"]],
  20:[["きてるよ！","キテル。キテル。"],["20回！いい感じ！","ニジュッカイ。イイネ。イイネ。"],["どんどんいこう！","ドンドン。ドンドン。"]],
  30:[["半分こえたよ！","ハンブン。トッパ。トッパ。"],["30回！すごい！","サンジュッカイ。スゴイ。スゴイ。"],["絶好調だね！","ゼッコウチョウ。ゼッコウチョウ。"]],
  40:[["あと10回！がんばれ！","ノコリ。ジュッカイ。ガンバレ。ガンバレ。"],["40回！もうすぐだよ！","ヨンジュッカイ。モウスグ。モウスグ。"],["ラストスパート！","ラスト。スパート。スパート。"]],
  50:[["やったね！目標達成！","ヤッタネ。ヤッタネ。モクヒョウ。タッセイ。"],["やったね！50回達成！","ゴジュッカイ。タッセイ。オメデトウ。オメデトウ。"]],
  bonus:[["まだいける！すごすぎ！","マダ。イケル。イケル。"],["ボーナスタイム！","ボーナス。ボーナス。"],["かっこいい！","カッコイイ。カッコイイ。"]]
};
function pickVoice(n){const p=VOICE[n]||VOICE.bonus;const [t,v]=p[Math.floor(Math.random()*p.length)];return n>GOAL?{text:`${n}回！${t}`,speech:`${n}カイ。${v}`}:{text:t,speech:v};}
function robotBlip(){try{if(!actx)return;[1320,990,1560].forEach((f,i)=>{const t=actx.currentTime+i*.09,o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.setValueAtTime(0,t+.07);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.08);});}catch(e){}}
let voiceOn=true;try{voiceOn=localStorage.getItem("mochimaru-voice")!=="off";}catch(e){}
let jaVoice=null;
function findVoice(){try{const vs=speechSynthesis.getVoices();jaVoice=vs.find(v=>/^ja/i.test(v.lang)&&/Kyoko|O-ren|Nanami|Google/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null;}catch(e){}}
try{findVoice();speechSynthesis.addEventListener?.("voiceschanged",findVoice);}catch(e){}
function speak(text,vol){
  if(!voiceOn||!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";if(jaVoice)u.voice=jaVoice;u.pitch=0.1;u.rate=2.2;u.volume=vol??1;
    if(vol===0)speechSynthesis.speak(u);else{robotBlip();setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){}},220);}}catch(e){}
}
function unlockVoice(){speak("。",0);} // iPhone needs the first utterance inside a tap
function ensureAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
async function start(){
  ensureAudio();unlockVoice();
  try{if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function")await DeviceMotionEvent.requestPermission();}catch(e){}
  try{wake=await navigator.wakeLock?.request("screen");}catch(e){}
  base=null;f=0;phase=0;sessionReps=0;running=true;
  window.addEventListener("devicemotion",onMotion);
  $("startBtn").hidden=true;$("status").hidden=false;$("stopBtn").hidden=false;
  say("しゃがんで、立って！",2000);
  setTimeout(()=>{if(!gotMotion&&running){$("status").hidden=true;$("notice").hidden=false;$("tapBtn").hidden=false;
    $("notice").textContent="この画面ではスマホの動きセンサーが使えないようです。今はタップで1回ずつ数えられます。センサーで数えるには、このゲームをSafariやChromeで直接開いてください。";}},1800);
}
$("startBtn").addEventListener("click",start);
function stop(){
  running=false;
  window.removeEventListener("devicemotion",onMotion);
  try{wake?.release();}catch(e){}wake=null;
  ["status","tapBtn","notice","stopBtn"].forEach(id=>$(id).hidden=true);
  const b=$("startBtn");b.hidden=false;b.textContent="スクワットを再開する";
  const c=S.days[todayKey()]||0,left=GOAL-c,n=sessionReps;
  let text,speech;
  if(n===0){text="今回は0回だったね。またあとでやろ！";speech="コンカイ。ゼロカイ。マタ。アトデ。";}
  else if(left>0){text=`おつかれさま！今回${n}回。今日はあと${left}回だよ`;speech=`コンカイ。${n}カイ。ノコリ。${left}カイ。オツカレ。サマデス。`;}
  else{text=`おつかれさま！今回${n}回。今日の目標は達成だよ`;speech=`コンカイ。${n}カイ。ホンジツ。ニンム。カンリョウ。オツカレ。サマデス。`;}
  say(text,6000);speak(speech);lastRepAt=Date.now();
}
$("stopBtn").addEventListener("click",stop);
$("tapBtn").addEventListener("click",()=>{ensureAudio();rep();});
$("voiceOn").checked=voiceOn;
$("voiceOn").addEventListener("change",e=>{voiceOn=e.target.checked;try{localStorage.setItem("mochimaru-voice",voiceOn?"on":"off");}catch(err){}ensureAudio();if(voiceOn)speak("ナイス。ナイス。");});
$("skipBtn").addEventListener("click",()=>{S.offset++;const m=rollover();render();say(m?`目標に届かなかった…（${HEALTH[S.health].name}）`:HEALTH[S.health].line,2600);});

function bindReset(){

    $("resetArea").innerHTML=`<span>たまごと何もないお部屋に戻す？</span><button class="small" id="yes">リセットする</button><button class="small" id="no">やめる</button>`;

function todayKeyFresh(){const d=new Date(Date.now()-DAY_START_HOUR*3600e3);return keyOf(d);}

/* ---------- pet chatter: picks a line from today's progress ---------- */
const TALK={
  zero:["今日はまだスクワットしてないよ〜","ねえねえ、いっしょに動こ？","50回、いっしょにがんばろ！","ちょっとだけでもやってみない？","スマホ持って、しゃがんで立つだけだよ","まずは10回からどう？"],
  low:["いいスタート！あと{left}回だよ","{count}回もできたね！","まだまだいけるよ〜","この調子でもうひと息！","足、あったまってきた？","続きもいっしょにやろ！"],
  high:["半分こえたね！すごい！","あと{left}回！ゴールが見えてきた","足がぽかぽかしてきた？","ここからが勝負だよ！","{count}回！かっこいい〜"],
  near:["あと{left}回！がんばれ〜！","もうすぐゴール！ふぁいと！","あと少し！{left}回だけ！"],
  done:["今日もありがとう！大好き！","50回できたね、えらい！","明日もいっしょにやろうね","ゆっくり休んでね","足、おつかれさま！","がんばるきみ、かっこいいよ"],
  bonus:["ボーナス{over}回！すごすぎ！","目標こえちゃった！かっこいい！","やりすぎ注意だよ〜、えへへ"],
  weak:["からだがだるいの…スクワットしてくれたら元気になれるかも","50回できたら、少し元気になれるかも…","いっしょに動いたら、なおる気がする…"],
  late:["今日はもうすぐおわっちゃうよ！あと{left}回！","朝4時までに、あと{left}回だよ！"],
  morning:["おはよう！今日もがんばろ","朝のスクワット、気持ちいいよ〜"]
};
let lastLine="";
function pickLine(){
  const c=S.days[todayKey()]||0,left=GOAL-c,hr=new Date().getHours();
  let pool;
  if(c>GOAL) pool=Math.random()<.5?TALK.bonus:TALK.done;
  else if(c===GOAL) pool=TALK.done;
  else if(S.health<=1&&Math.random()<.6) pool=TALK.weak;
  else if((hr>=21||hr<DAY_START_HOUR)&&Math.random()<.5) pool=TALK.late;
  else if(c===0) pool=(hr>=DAY_START_HOUR&&hr<10&&Math.random()<.4)?TALK.morning:TALK.zero;
  else if(left<=10) pool=TALK.near;
  else if(c<25) pool=TALK.low;
  else pool=TALK.high;
  let line,n=0;
  do{line=pool[Math.floor(Math.random()*pool.length)];}while(line===lastLine&&pool.length>1&&++n<5);
  lastLine=line;
  return line.replace("{left}",left).replace("{count}",c).replace("{over}",c-GOAL);
}
function talk(){say(pickLine(),5000);}
function chatter(){
  const busy=Date.now()-lastRepAt<8000||document.querySelector(".celebrate")||document.hidden;
  if(!busy)talk();
  setTimeout(chatter,14000+Math.random()*12000);
}
setTimeout(chatter,9000);
$("room").addEventListener("click",()=>{talk();petHop();});

(function initPet3D(){

})();

  const missed=rollover();render();
  if(missed)say(`${missed}日、目標に届かなかった…（${HEALTH[S.health].name}）`,4000);else talk();
}

window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??null);
